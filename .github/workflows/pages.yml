name: Deploy AI 探新社

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract and check website
        run: |
          unzip -q ai-tanxinshe-site.zip
          test -f ai-tanxinshe/index.html
          node ai-tanxinshe/check.mjs

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ai-tanxinshe

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
